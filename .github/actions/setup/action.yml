name: Set up toolchain
description: Install Tauri's Linux system libraries, the mise tools, and the Rust build cache

inputs:
  cache-key:
    description: Extra key for the Rust build cache, e.g. the target triple
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Tauri system libraries (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
          libxdo-dev libssl-dev patchelf file

    - name: Install mise tools
      uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

    # After mise, so the cache key includes the installed rustc version.
    - name: Cache Rust build
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.cache-key }}
        cache-on-failure: true
